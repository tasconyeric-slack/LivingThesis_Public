[project]
name = "living-thesis-backend"
version = "0.5.1"
description = "Source-grounded filing -> facts -> thesis delta pipeline for Living Thesis"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
